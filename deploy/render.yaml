# Render Blueprint for PRAMAAN. Set "Blueprint path" to deploy/render.yaml when creating the
# Blueprint in the Render dashboard (default path is render.yaml at the repository root).
# Plans/regions are deliberately not pinned: choose them in the dashboard and check current
# pricing. A persistent disk requires a paid web-service instance type.
databases:
  - name: pramaan-db
    databaseName: pramaan
    user: pramaan_app
    region: singapore
    postgresMajorVersion: '16'
    ipAllowList: [] # private network only (API connects over Render's internal network)

services:
  - type: web
    name: pramaan-api
    runtime: node
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false --filter "@pramaan/api..." && pnpm -r --filter "./packages/*" run build && pnpm --filter @pramaan/api run build
    preDeployCommand: node apps/api/dist/database/migrate-cli.js
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    disk:
      name: pramaan-evidence
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22.22.0'
      - key: DATABASE_URL
        fromDatabase:
          name: pramaan-db
          property: connectionString
      - key: DATABASE_SSL_MODE
        value: disable # internal URL on Render's private network
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://pramaan-admin.onrender.com
      - key: COOKIE_SAMESITE
        value: none # *.onrender.com is a public suffix → dashboard and API are cross-site
      - key: TRUST_PROXY
        value: '1'
      - key: EVIDENCE_STORAGE_DIR
        value: /var/data/evidence
      - key: ALLOW_DEMO_SEED
        value: 'false'
      - key: LOG_LEVEL
        value: info

  - type: web
    name: pramaan-admin
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false --filter "@pramaan/admin..." && pnpm --filter @pramaan/admin run build
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # e.g. https://pramaan-api.onrender.com
      - key: NODE_VERSION
        value: '22.22.0'
