name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pramaan
          POSTGRES_PASSWORD: pramaan_ci_only
          POSTGRES_DB: pramaan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pramaan" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://pramaan:pramaan_ci_only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm run lint
      - run: pnpm -r --filter=!pramaan run typecheck
      - run: pnpm -r --filter=!pramaan run test
      - run: pnpm --filter @pramaan/api run build && pnpm --filter @pramaan/admin run build
      - run: pnpm audit --prod

  mobile-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/mobile
      - run: npx tsc -p tsconfig.json --noEmit && npx vitest run
        working-directory: apps/mobile
      - run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/index.android.bundle --assets-dest /tmp/assets
        working-directory: apps/mobile

  android:
    # Not executed in the authoring environment (no Android SDK / Maven access). Expected to run on GitHub-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
        working-directory: apps/mobile
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
        working-directory: apps/mobile/android
