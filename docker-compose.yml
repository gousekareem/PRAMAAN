# Local development services.
#   docker compose up -d db                 -> PostgreSQL 16 + PostGIS 3.4 only (recommended for development)
#   docker compose --profile full up -d     -> also runs the API and dashboard containers
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pramaan-db
    environment:
      POSTGRES_USER: pramaan
      POSTGRES_PASSWORD: pramaan_dev_only # development only
      POSTGRES_DB: pramaan
    ports:
      - '5433:5432'
    volumes:
      - pramaan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pramaan -d pramaan']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://pramaan:pramaan_dev_only@db:5432/pramaan
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      CORS_ORIGINS: http://localhost:8080
      EVIDENCE_STORAGE_DIR: /data/evidence
      RUN_MIGRATIONS_ON_START: 'true'
    volumes:
      - pramaan-evidence:/data/evidence
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  admin:
    profiles: ['full']
    build:
      context: .
      dockerfile: deploy/Dockerfile.admin
      args:
        VITE_API_BASE_URL: http://localhost:4000
    ports:
      - '8080:8080'
    depends_on: [api]

volumes:
  pramaan-pgdata:
  pramaan-evidence:
